<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballon Turbo - Supreme Factory V320</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .imperial-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .btn-magic { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); transition: 0.4s; }
        .btn-magic:hover { transform: scale(1.01); filter: brightness(1.2); box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
        input, textarea, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: #fff !important; appearance: none; }
        textarea:focus, select:focus { border-color: #3b82f6 !important; outline: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div class="flex flex-col">
                <h1 class="text-4xl font-black text-blue-500 tracking-tighter">مصنع الروابط V320</h1>
                <span class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.3em]">Imperial Turbo Engine</span>
            </div>
            <a href="decoder.html" class="text-red-400 border border-red-900/50 px-6 py-2 rounded-2xl hover:bg-red-600 hover:text-white transition-all font-bold text-sm">المفكك الملكي</a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- قسم المدخلات -->
            <div class="lg:col-span-5 space-y-6">
                <div class="imperial-glass p-6 rounded-[2rem] shadow-2xl">
                    <h2 class="text-lg font-bold mb-4 text-blue-400"><i class="fas fa-plus-circle ml-2"></i>إعداد السيرفر</h2>
                    <div class="space-y-4">
                        <input type="text" id="url" placeholder="رابط البث (URL) *" class="w-full rounded-xl px-4 py-3 text-sm">
                        <select id="engine" class="w-full rounded-xl px-4 py-3 text-sm font-bold text-blue-300">
                            <option value="auto">المحرك: تلقائي (Auto)</option>
                            <option value="exo">المحرك: Exo Player</option>
                            <option value="vlc">المحرك: VLC</option>
                        </select>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="referer" placeholder="Referer" class="w-full rounded-xl px-4 py-2 text-xs">
                            <input type="text" id="ua" placeholder="User-Agent" class="w-full rounded-xl px-4 py-2 text-xs">
                        </div>

                        <div class="p-4 bg-slate-950/50 rounded-2xl border border-slate-800 space-y-3">
                            <select id="drmType" class="w-full rounded-xl px-4 py-2 text-xs font-bold" onchange="updateDrmPlaceholder()">
                                <option value="none">بدون تشفير</option>
                                <option value="clearkey">ClearKey</option>
                                <option value="widevine">Widevine</option>
                            </select>
                            <input type="text" id="drmData" placeholder="بيانات التشفير" class="w-full rounded-xl px-4 py-2 text-xs font-mono text-center">
                        </div>

                        <button onclick="addServer()" class="w-full py-3 rounded-xl bg-blue-600 text-white font-black hover:bg-blue-500 transition">
                            تثبيت السيرفر في القائمة
                        </button>
                    </div>
                </div>

                <!-- خانة الرمز السري - هنا يمكنك وضع أي رقم -->
                <div class="imperial-glass p-6 rounded-[2rem] border-red-500/20">
                    <label class="block text-xs font-bold text-red-400 mb-2 uppercase">الرمز السري الخاص بك (أي رقم)</label>
                    <input type="text" id="secretKey" placeholder="أدخل رمز فك التشفير هنا..." class="w-full rounded-xl px-4 py-3 text-sm border-red-500/30">
                </div>

                <div id="serverList" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- قسم النتائج -->
            <div class="lg:col-span-7 space-y-6">
                <div class="imperial-glass p-8 rounded-[2.5rem] space-y-6 shadow-2xl">
                    <button onclick="generateFinalPayload()" class="w-full py-5 rounded-2xl btn-magic text-white font-black text-2xl">
                        توليد الكود الإمبراطوري
                    </button>

                    <div class="space-y-2">
                        <label class="block text-xs font-black text-yellow-500 uppercase">كود التشغيل (On-Click)</label>
                        <textarea id="outputOnClick" readonly class="w-full bg-slate-950 rounded-2xl p-4 text-[10px] font-mono text-yellow-400 h-28 border border-yellow-900/30"></textarea>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-green-500 uppercase">المصفوفة المشفرة</label>
                        <textarea id="outputEnc" readonly class="w-full bg-slate-950 rounded-2xl p-4 text-[10px] font-mono text-green-500 h-20 border border-slate-800"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let servers = [];

        function updateDrmPlaceholder() {
            const type = document.getElementById('drmType').value;
            const input = document.getElementById('drmData');
            input.placeholder = (type === 'clearkey') ? "KID:KEY" : (type === 'none' ? "لا يتطلب بيانات" : "License URL");
        }

        function addServer() {
            const u = document.getElementById('url').value;
            if (!u) return alert("الرابط مطلوب!");
            servers.push({
                url: u,
                engine: document.getElementById('engine').value,
                referer: document.getElementById('referer').value,
                ua: document.getElementById('ua').value,
                drmType: document.getElementById('drmType').value,
                drmData: document.getElementById('drmData').value
            });
            render();
            document.getElementById('url').value = ""; 
        }

        function render() {
            const list = document.getElementById('serverList');
            list.innerHTML = servers.map((s, i) => `
                <div class="imperial-glass p-3 rounded-xl flex justify-between items-center text-[10px] mb-2 border-r-4 border-blue-500">
                    <span class="truncate">${s.url}</span>
                    <button onclick="servers.splice(${i},1);render()" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function generateFinalPayload() {
            const keyInput = document.getElementById('secretKey').value;
            if (servers.length === 0) return alert("أضف سيرفرات أولاً!");
            if (!keyInput) return alert("يرجى إدخال الرمز السري الذي تريده!");

            // تجميع بيانات السيرفرات
            let formattedServers = servers.map(s => {
                let entry = (s.engine === "auto") ? s.url : `${s.engine} :: ${s.url}`;
                if (s.drmType !== "none" && s.drmData) entry += `|drm=${s.drmType}:${s.drmData}`;
                if (s.referer) entry += `|Referer=${s.referer}`;
                if (s.ua) entry += `|User-Agent=${s.ua}`;
                return entry;
            });

            let master = formattedServers[0];
            if (formattedServers.length > 1) {
                master += `|servers=${formattedServers.slice(1).join(',')}`;
            }

            // التشفير باستخدام الرمز السري المدخل (أياً كان)
            // الصيغة: الرمز::البيانات ثم تحويل الكل لـ Base64
            const combinedData = keyInput + "::" + master;
            
            // تحويل النص إلى Base64 مع دعم اللغة العربية (UTF-8)
            const base64Encoded = btoa(encodeURIComponent(combinedData).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));

            document.getElementById('outputEnc').value = base64Encoded;
            document.getElementById('outputOnClick').value = `onclick="location.href='intent://open?url=${base64Encoded}#Intent;scheme=ballon;package=com.ballon.player;end'"`;
            
            alert("تم التوليد بنجاح باستخدام الرمز: " + keyInput);
        }
    </script>
</body>
</html>
