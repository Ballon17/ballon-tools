<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballon Turbo - Royal Decoder V320</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .imperial-glass { background: rgba(239, 68, 68, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(239, 68, 68, 0.2); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: #fff !important; }
        input:focus { border-color: #ef4444 !important; outline: none; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        
        .engine-exo { background: #2563eb; color: #fff; }
        .engine-vlc { background: #ea580c; color: #fff; }
        .engine-shaka { background: #9333ea; color: #fff; }
        .engine-browser { background: #16a34a; color: #fff; }
        .engine-auto { background: #475569; color: #fff; }

        .server-card { border-right: 5px solid #ef4444; background: linear-gradient(to left, rgba(239, 68, 68, 0.05), transparent); transition: 0.3s; }
        .server-card:hover { transform: translateX(-5px); background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-black text-red-500 tracking-tighter">مفكك الشفرات الملكي V320</h1>
            <a href="index.html" class="text-slate-500 hover:text-blue-400 transition-all font-bold flex items-center gap-2">
                العودة للمصنع <i class="fas fa-arrow-left"></i>
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- لوحة الإدخال -->
            <div class="lg:col-span-5 space-y-6">
                <div class="imperial-glass p-8 rounded-[2.5rem] shadow-2xl border-red-500/20">
                    <h2 class="text-xl font-bold mb-6 text-red-400 flex items-center gap-3">
                        <i class="fas fa-microchip"></i> فحص وتحليل الأكواد
                    </h2>
                    
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">الكود المشفر</label>
                            <textarea id="inputData" placeholder="الصق الرابط (intent) أو كود الـ Base64 هنا..." class="w-full rounded-2xl px-5 py-4 text-[10px] font-mono h-48 outline-none leading-relaxed"></textarea>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">الرمز السري الخاص بالكود</label>
                            <!-- تم تغيير النوع إلى text ليقبل أي رموز وتغيير الوصف -->
                            <input type="text" id="secretKey" placeholder="أدخل الرمز السري المستخدم..." class="w-full rounded-xl px-4 py-3 text-sm">
                        </div>

                        <button onclick="imperialDecrypt()" class="w-full bg-red-600 py-5 rounded-2xl text-white font-black text-xl hover:bg-red-500 transition-all shadow-xl shadow-red-900/20">
                            استخراج البيانات العميقة
                        </button>
                    </div>
                </div>
            </div>

            <!-- لوحة النتائج -->
            <div class="lg:col-span-7">
                <div id="placeholder" class="imperial-glass p-20 rounded-[2.5rem] text-center opacity-30 border-dashed border-2 border-slate-700">
                    <i class="fas fa-barcode text-7xl mb-6"></i>
                    <p class="text-xl">جاهز لتحليل أي مصفوفة برمجية قادمة...</p>
                </div>

                <div id="resultBox" class="hidden space-y-6">
                    <div id="analysisContainer" class="space-y-6"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function imperialDecrypt() {
            let input = document.getElementById('inputData').value.trim();
            const keyEntered = document.getElementById('secretKey').value.trim();
            const container = document.getElementById('analysisContainer');
            const placeholder = document.getElementById('placeholder');
            const resultBox = document.getElementById('resultBox');

            if (!input || !keyEntered) return alert("يرجى إدخال الكود والرمز السري!");

            try {
                // 1. استخراج الـ Base64 من الـ Intent إذا وجد
                let base64String = input;
                if (input.includes("url=")) {
                    base64String = input.split("url=")[1].split("#")[0].split("'")[0];
                }

                // 2. فك تشفير الـ Base64 مع معالجة اللغة العربية
                const decodedRaw = decodeURIComponent(escape(atob(base64String)));
                
                // 3. تقسيم البيانات (الرمز::المحتوى)
                if (!decodedRaw.includes("::")) {
                    return alert("تنسيق الكود غير صحيح أو لم يتم تشفيره بهذا المصنع.");
                }

                const parts = decodedRaw.split("::");
                const keyFromCode = parts[0];
                const matrixContent = parts[1];

                // 4. التحقق من تطابق الرمز السري (أياً كان نوعه)
                if (keyFromCode !== keyEntered) {
                    return alert(`فشل التحقق! الرمز السري "${keyEntered}" غير صحيح لهذا الكود.`);
                }

                // تصفية المحتوى للبدء في العرض
                container.innerHTML = "";

                const mainServerFull = matrixContent.split("|servers=")[0];
                const backupServersPart = matrixContent.includes("|servers=") ? matrixContent.split("|servers=")[1] : "";

                renderServerCard(mainServerFull, "السيرفر الأساسي (Master)");

                if (backupServersPart) {
                    backupServersPart.split(",").forEach((s, i) => {
                        if(s) renderServerCard(s, `سيرفر احتياطي رقم ${i+1}`);
                    });
                }

                placeholder.classList.add('hidden');
                resultBox.classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert("خطأ: تعذر فك تشفير البيانات. تأكد من صحة الكود المشفر.");
            }
        }

        function renderServerCard(fullString, cardTitle) {
            const container = document.getElementById('analysisContainer');
            let engine = "auto";
            let rawUrl = fullString;
            
            if (fullString.includes(" :: ")) {
                engine = fullString.split(" :: ")[0].toLowerCase().trim();
                rawUrl = fullString.split(" :: ")[1];
            }

            const segments = rawUrl.split("|");
            const finalUrl = segments[0];
            const metadata = segments.slice(1);

            let drmInfo = { type: "none", data: null };
            metadata.forEach(m => {
                if (m.startsWith("drm=")) {
                    drmInfo.type = m.split("=")[1].split(":")[0];
                    drmInfo.data = m.split(`${drmInfo.type}:`)[1];
                }
            });

            let html = `
                <div class="server-card imperial-glass p-6 rounded-[2rem] border-l-0 border-r-4 border-red-600">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black px-3 py-1 rounded-full uppercase engine-${engine}">${engine} engine</span>
                        <h3 class="text-slate-400 font-bold text-xs uppercase">${cardTitle}</h3>
                    </div>
                    <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 mb-4">
                        <p class="text-[8px] text-slate-500 mb-1 font-bold">STREAMING URL</p>
                        <p class="text-[11px] font-mono text-blue-400 break-all">${finalUrl}</p>
                    </div>`;

            if (drmInfo.type !== "none") {
                html += `
                <div class="mb-4 p-4 bg-yellow-500/5 border border-yellow-500/20 rounded-2xl">
                    <span class="text-[10px] font-black text-yellow-500 uppercase block mb-1">Protection: ${drmInfo.type}</span>
                    <p class="text-[10px] font-mono text-slate-400 break-all">${drmInfo.data}</p>
                </div>`;
            }

            let badges = metadata.filter(m => !m.startsWith("drm=")).map(m => {
                const [k, v] = m.split("=");
                return `<div class="bg-slate-900/50 p-2 px-3 rounded-xl border border-slate-800 flex flex-col">
                    <span class="text-[8px] font-bold text-red-500 uppercase">${k}</span>
                    <span class="text-[10px] text-slate-300 truncate">${v || 'Enabled'}</span>
                </div>`;
            }).join("");

            html += `<div class="grid grid-cols-2 gap-2">${badges || '<p class="text-[9px] text-slate-600 italic">لا توجد هيدرز إضافية</p>'}</div></div>`;
            container.innerHTML += html;
        }
    </script>
</body>
</html>
