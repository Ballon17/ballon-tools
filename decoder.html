<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballon Turbo - Royal Decoder V320</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .imperial-glass { background: rgba(239, 68, 68, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(239, 68, 68, 0.2); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: #fff !important; }
        input:focus { border-color: #ef4444 !important; outline: none; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        
        /* ألوان المحركات الإمبراطورية */
        .engine-exo { background: linear-gradient(90deg, #2563eb, #1d4ed8); color: #fff; }
        .engine-vlc { background: linear-gradient(90deg, #ea580c, #c2410c); color: #fff; }
        .engine-shaka { background: linear-gradient(90deg, #9333ea, #7e22ce); color: #fff; }
        .engine-web { background: linear-gradient(90deg, #16a34a, #15803d); color: #fff; }
        .engine-auto { background: #475569; color: #fff; }

        .server-card { 
            border-right: 5px solid #ef4444; 
            background: linear-gradient(to left, rgba(239, 68, 68, 0.05), transparent); 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .server-card:hover { transform: scale(1.02); background: rgba(239, 68, 68, 0.1); }
        
        .pulse-red { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div class="flex flex-col">
                <h1 class="text-4xl font-black text-red-500 tracking-tighter">مفكك الشفرات الملكي V320</h1>
                <span class="text-[10px] text-red-900 font-bold uppercase tracking-[0.5em]">Supreme Security Analysis</span>
            </div>
            <a href="index.html" class="text-slate-500 hover:text-red-400 transition-all font-bold flex items-center gap-2">
                <i class="fas fa-arrow-right"></i> العودة للمصنع
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- لوحة الإدخال -->
            <div class="lg:col-span-5 space-y-6">
                <div class="imperial-glass p-8 rounded-[2.5rem] shadow-2xl border-red-500/20">
                    <h2 class="text-xl font-bold mb-6 text-red-400 flex items-center gap-3">
                        <i class="fas fa-unlock-keyhole pulse-red rounded-full p-2"></i> فك مصفوفة البيانات
                    </h2>
                    
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-500 uppercase tracking-widest">الكود المشفر (Base64 / Intent)</label>
                            <textarea id="inputData" placeholder="الصق كود الـ Payload المشفر هنا..." class="w-full rounded-2xl px-5 py-4 text-[10px] font-mono h-48 outline-none leading-relaxed transition-all"></textarea>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs font-black text-yellow-600 uppercase tracking-widest">مفتاح فك التشفير (Variable Key)</label>
                            <input type="text" id="secretKey" placeholder="أدخل الرمز السري المستخدم عند التوليد..." class="w-full rounded-xl px-4 py-3 text-sm font-bold text-yellow-500 bg-slate-950">
                        </div>

                        <button onclick="imperialDecrypt()" class="w-full bg-red-600 py-5 rounded-2xl text-white font-black text-xl hover:bg-red-500 transition-all shadow-xl shadow-red-900/40 transform active:scale-95">
                            تحليل المصفوفة البرمجية
                        </button>
                    </div>
                </div>
            </div>

            <!-- لوحة النتائج -->
            <div class="lg:col-span-7">
                <div id="placeholder" class="imperial-glass p-20 rounded-[2.5rem] text-center opacity-30 border-dashed border-2 border-slate-700">
                    <i class="fas fa-microchip text-7xl mb-6"></i>
                    <p class="text-xl font-bold">بانتظار تلقي الإشارة البرمجية للتحليل...</p>
                </div>

                <div id="resultBox" class="hidden space-y-6 animate__animated animate__fadeIn">
                    <div class="flex items-center justify-between px-4">
                        <span class="text-[10px] font-black text-green-500 uppercase"><i class="fas fa-check-circle"></i> التحقق من المفتاح ناجح</span>
                        <span id="variableKeyBadge" class="bg-red-900/20 text-red-400 text-[10px] px-4 py-1 rounded-full border border-red-500/30 font-bold uppercase tracking-widest"></span>
                    </div>
                    <div id="analysisContainer" class="space-y-6"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function imperialDecrypt() {
            let input = document.getElementById('inputData').value.trim();
            const keyEntered = document.getElementById('secretKey').value.trim();
            const container = document.getElementById('analysisContainer');
            const placeholder = document.getElementById('placeholder');
            const resultBox = document.getElementById('resultBox');
            const keyBadge = document.getElementById('variableKeyBadge');

            if (!input || !keyEntered) return alert("خطأ: يرجى إدخال الكود والرمز السري!");

            try {
                // 1. استخراج الـ Base64 من الـ Intent إذا وجد
                let base64String = input;
                if (input.includes("url=")) {
                    base64String = input.split("url=")[1].split("#")[0].split("'")[0].split('"')[0];
                }

                // 2. فك تشفير الـ Base64 (دعم UTF-8)
                const decodedRaw = decodeURIComponent(escape(atob(base64String)));
                
                // 3. تقسيم البيانات (الرمز::المحتوى)
                if (!decodedRaw.includes("::")) {
                    return alert("خطأ في البنية: الكود لا يحتوي على علامة الفصل الإمبراطورية ::");
                }

                const parts = decodedRaw.split("::");
                const keyFromCode = parts[0].trim();
                
                // تجميع بقية الأجزاء في حال كان المحتوى يحتوي على :: أيضاً
                const matrixContent = parts.slice(1).join("::").trim();

                // 4. التحقق من تطابق الرمز السري المتغير
                if (keyFromCode !== keyEntered) {
                    return alert(`فشل التحقق! الرمز السري المستخدم "${keyEntered}" لا يطابق الرمز المشفر في الكود.`);
                }

                keyBadge.textContent = "Key ID: " + keyFromCode;

                // تصفية المحتوى للبدء في العرض
                container.innerHTML = "";

                // التعامل مع السيرفرات المتعددة
                const mainServerFull = matrixContent.split("|servers=")[0];
                const backupServersPart = matrixContent.includes("|servers=") ? matrixContent.split("|servers=")[1] : "";

                renderServerCard(mainServerFull, "سيرفر البث الأساسي (Master)");

                if (backupServersPart) {
                    backupServersPart.split(",").forEach((s, i) => {
                        if(s) renderServerCard(s, `سيرفر احتياطي رقم ${i+1}`);
                    });
                }

                placeholder.classList.add('hidden');
                resultBox.classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert("خطأ قاتل: الكود تالف أو تم تشفيره بنظام غير متوافق مع V320.");
            }
        }

        function renderServerCard(fullString, cardTitle) {
            const container = document.getElementById('analysisContainer');
            
            // [النظام المطور]: الرابط أولاً ثم المحرك في النهاية
            let engine = "auto";
            let contentBeforeEngine = fullString;

            // التحقق من وجود المحرك في النهاية مسبوقاً بـ ::
            if (fullString.includes(" :: ")) {
                const parts = fullString.split(" :: ");
                engine = parts[parts.length - 1].toLowerCase().trim();
                // استعادة بقية النص في حال كان الرابط يحتوي على ::
                contentBeforeEngine = parts.slice(0, -1).join(" :: ").trim();
            }

            const segments = contentBeforeEngine.split("|");
            const finalUrl = segments[0]; // السجمنت الأول دائماً هو الرابط
            const metadata = segments.slice(1);

            let drmInfo = { type: "none", data: null };
            metadata.forEach(m => {
                if (m.startsWith("drm=")) {
                    drmInfo.type = m.split("=")[1].split(":")[0];
                    drmInfo.data = m.split(`${drmInfo.type}:`)[1];
                }
            });

            let html = `
                <div class="server-card imperial-glass p-6 rounded-[2.5rem] border-l-0 border-r-4 border-red-600 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black px-4 py-1 rounded-full uppercase engine-${engine}">${engine} Engine</span>
                        <h3 class="text-slate-400 font-bold text-[10px] uppercase tracking-tighter">${cardTitle}</h3>
                    </div>
                    
                    <div class="bg-slate-950/80 p-5 rounded-3xl border border-slate-800 mb-4 group">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[8px] text-red-500 font-black uppercase">Direct Stream URL</span>
                            <i class="fas fa-link text-[10px] text-slate-700"></i>
                        </div>
                        <p class="text-[11px] font-mono text-blue-400 break-all leading-relaxed">${finalUrl}</p>
                    </div>`;

            if (drmInfo.type !== "none") {
                html += `
                <div class="mb-4 p-4 bg-yellow-500/5 border border-yellow-500/20 rounded-2xl animate__animated animate__headShake">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fas fa-shield-virus text-yellow-600 text-xs"></i>
                        <span class="text-[10px] font-black text-yellow-500 uppercase">Protection System: ${drmInfo.type}</span>
                    </div>
                    <p class="text-[10px] font-mono text-slate-400 break-all select-all">${drmInfo.data}</p>
                </div>`;
            }

            // تصفية الهيدرز (User-Agent, Referer, إلخ)
            let badges = metadata.filter(m => !m.startsWith("drm=")).map(m => {
                const parts = m.split("=");
                const k = parts[0];
                const v = parts.slice(1).join("="); // للتعامل مع وجود = داخل القيمة
                return `
                <div class="bg-slate-900/50 p-2 px-3 rounded-2xl border border-slate-800/50 flex flex-col">
                    <span class="text-[8px] font-black text-red-600 uppercase mb-1">${k}</span>
                    <span class="text-[10px] text-slate-300 truncate font-mono">${v || 'Enabled'}</span>
                </div>`;
            }).join("");

            html += `
                <div class="grid grid-cols-2 gap-3">
                    ${badges || '<div class="col-span-2 text-center p-2 border border-dashed border-slate-800 rounded-2xl"><span class="text-[9px] text-slate-600 italic">No extra headers detected</span></div>'}
                </div>
            </div>`;
            
            container.innerHTML += html;
        }
    </script>
</body>
</html>
